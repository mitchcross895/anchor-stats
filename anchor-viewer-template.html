<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor Review</title>
<style>
  :root {
    --bg: #101317; --panel: #171b21; --panel-2: #1e232b; --line: #2a313b;
    --text: #e6e9ee; --muted: #8b94a3; --map: #2b323c; --map-label: #5d6775;
    --ct: #5aa9ff; --t: #f0a03c; --anchor: #ffffff; --good: #4fd18b; --bad: #ff6b6b;
    --contact: #ffd84d; --accent: #8fb8ff;
    --smoke: #d5dbe3; --fire: #ff7a29; --flash: #fff6c2; --he: #ff4d4d; --decoy: #7ee787;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 290px 1fr 360px; height: 100vh; }
  aside, .notes { background: var(--panel); overflow-y: auto; }
  aside { border-right: 1px solid var(--line); }
  .notes { border-left: 1px solid var(--line); padding: 16px; }
  h1 { font-size: 15px; margin: 0; padding: 14px 16px 4px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 12px; padding: 0 16px 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
  aside h2 { padding: 0 16px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .ratings td, .ratings th { padding: 5px 8px; text-align: right; font-size: 12.5px; }
  .ratings th { color: var(--muted); font-weight: 500; }
  .ratings td:first-child, .ratings th:first-child { text-align: left; padding-left: 16px; }
  .ratings tr.row { cursor: pointer; }
  .ratings tr.row:hover, .ratings tr.sel { background: var(--panel-2); }

  .list { list-style: none; margin: 0; padding: 0 8px 16px; }
  .list li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: grid;
             grid-template-columns: 34px 1fr auto; gap: 2px 8px; align-items: center; }
  .list li:hover { background: var(--panel-2); }
  .list li.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .list .r { color: var(--muted); font-size: 12px; }
  .list .who { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .meta { grid-column: 2; color: var(--muted); font-size: 12px; }
  .list .sc { grid-row: 1 / span 2; grid-column: 3; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); } .neg { color: var(--bad); }

  main { display: flex; flex-direction: column; min-width: 0; }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  .clock { position: absolute; top: 12px; left: 14px; background: rgba(16,19,23,.8); padding: 6px 10px;
           border-radius: 6px; font-variant-numeric: tabular-nums; font-size: 13px; pointer-events: none; }
  .legend { position: absolute; top: 12px; right: 14px; background: rgba(16,19,23,.8); padding: 6px 10px;
            border-radius: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; pointer-events: none; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  .controls { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px 12px; }
  .bar { position: relative; height: 22px; margin-bottom: 8px; }
  .bar input { position: absolute; inset: 0; width: 100%; margin: 0; accent-color: var(--accent); }
  .marks { position: absolute; left: 8px; right: 8px; top: 0; bottom: 0; pointer-events: none; }
  .mark { position: absolute; top: 0; width: 3px; height: 7px; border-radius: 2px; transform: translateX(-1px); }
  .row-btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row-btns button, .row-btns select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
           padding: 5px 10px; cursor: pointer; }
  .row-btns button:hover { border-color: var(--accent); }
  .row-btns .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .title { font-size: 18px; font-weight: 700; }
  .badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; text-align: right; }
  .big small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .why { margin: 0; padding-left: 18px; }
  .why li { margin-bottom: 6px; }
  .bd td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .bd td:last-child { text-align: right; font-weight: 600; white-space: nowrap; padding-left: 10px; }
  .bd .d { color: var(--muted); font-size: 12px; }
  .bd tr.total td { border-bottom: 0; font-weight: 700; }
  .feed { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .feed li { padding: 4px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; color: var(--muted); }
  .feed li.past { color: var(--text); }
  .feed li:hover { background: var(--panel-2); }
  .feed .tm { font-variant-numeric: tabular-nums; min-width: 44px; }
  .feed.no-util li.util { display: none; }
  .feed .dot { margin-right: 4px; }
  body.no-util .util-key { display: none; }

  .lib { padding: 0 16px 4px; display: flex; flex-direction: column; gap: 8px; }
  .lib[hidden] { display: none; }
  .lib .pick { display: flex; gap: 6px; }
  .lib select { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  a.btn { color: inherit; text-decoration: none; text-align: center; font-size: 12.5px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .jobs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .jobs li { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .jobs .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jobs .st { color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .jobs li.err { border-color: var(--bad); }
  .jobs li.err .st { color: var(--bad); }
  .jobs .x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; }
  .prog { height: 3px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .prog.busy i { width: 35% !important; animation: busy 1.2s ease-in-out infinite; }
  @keyframes busy { from { margin-left: -35%; } to { margin-left: 100%; } }

  .empty { position: absolute; inset: 16px; display: flex; align-items: center; justify-content: center; text-align: center;
           border: 2px dashed var(--line); border-radius: 12px; background: rgba(16,19,23,.85); }
  .empty[hidden] { display: none; }
  .empty b { font-size: 17px; display: block; margin-bottom: 8px; }
  body.dropping .empty { display: flex; border-color: var(--accent); }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside, .notes { border: 0; max-height: none; }
    .stage { height: 70vh; flex: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Anchor Review</h1>
    <div class="sub" id="mapname"></div>
    <div class="lib" id="lib" hidden>
      <div class="pick">
        <select id="demoPick" title="Processed demos"></select>
        <button class="btn primary" id="uploadBtn">Upload</button>
      </div>
      <a class="btn" id="exportBtn" hidden title="Download a standalone copy of this demo's review that works offline">Download offline copy</a>
      <input type="file" id="file" accept=".dem" multiple hidden>
      <ul class="jobs" id="jobs"></ul>
    </div>
    <h2>Ratings</h2>
    <table class="ratings" id="ratings"></table>
    <h2>Engagements</h2>
    <ul class="list" id="list"></ul>
  </aside>

  <main>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="clock" id="clock"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--ct)"></span>CT</span>
        <span><span class="dot" style="background:var(--t)"></span>T</span>
        <span><span class="dot" style="background:var(--anchor)"></span>Anchor</span>
        <span>dashed ring = local area</span>
        <span class="util-key"><span class="dot" style="background:var(--smoke)"></span>smoke
          <span class="dot" style="background:var(--fire);margin-left:6px"></span>fire
          <span class="dot" style="background:var(--flash);margin-left:6px"></span>flash
          <span class="dot" style="background:var(--he);margin-left:6px"></span>HE</span>
      </div>
      <div class="empty" id="empty" hidden>
        <div>
          <b>Drop a CS2 .dem file here</b>
          <button class="btn primary" id="emptyUpload">Choose a demo</button>
          <p class="hint">It's parsed on this computer in a few seconds.</p>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="bar">
        <input type="range" id="scrub" min="0" max="1" step="1" value="0">
        <div class="marks" id="marks"></div>
      </div>
      <div class="row-btns">
        <button id="prev" title="Previous engagement ( [ )">&#9664;&#9664;</button>
        <button id="play" title="Play / pause (space)">Play</button>
        <button id="next" title="Next engagement ( ] )">&#9654;&#9654;</button>
        <button id="tocontact" title="Jump to contact">Contact</button>
        <select id="speed" title="Playback speed">
          <option value="0.5">0.5x</option><option value="1" selected>1x</option>
          <option value="2">2x</option><option value="4">4x</option>
        </select>
        <button id="fit">Fit map</button>
        <button id="focus">Focus fight</button>
        <button id="level" title="Which level of the map to show" hidden>Level: auto</button>
        <button id="util" title="Show grenades (U)">Utility: on</button>
        <span class="spacer"></span>
        <span class="hint">space play &middot; &larr;/&rarr; 1s &middot; [ ] fight &middot; U utility &middot; scroll zoom &middot; drag pan</span>
      </div>
    </div>
  </main>

  <section class="notes" id="notes"></section>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
// Embedded data = a standalone review.html export; null = served by the app, which handles uploads.
let EMBEDDED = null;
try { EMBEDDED = JSON.parse(document.getElementById('data').textContent); } catch (e) { /* the raw template */ }
let D = null, TR = 64;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {};
['--map','--map-label','--ct','--t','--anchor','--good','--bad','--contact','--muted','--text','--bg',
 '--smoke','--fire','--flash','--he','--decoy'].forEach(k => C[k.slice(2)] = css(k));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => (v > 0 ? '+' : '') + v.toFixed(2);
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';

// ---------- load a demo's data
let B = null, cell = 1, minX = 0, maxX = 1, minY = 0, maxY = 1;
let radar = { upper: null, lower: null }, level = 'auto';  // level: auto | upper | lower (two-level maps)
let showUtil = true;
// grenade look: colour var, effect radius in world units, seconds a burst stays visible
const UTIL = {
  smoke: { col: 'smoke', r: 144, name: 'smoke' },
  molotov: { col: 'fire', r: 150, name: 'molotov' },
  flash: { col: 'flash', r: 220, name: 'flash', burst: 0.5 },
  he: { col: 'he', r: 350, name: 'HE grenade', burst: 0.6 },
  decoy: { col: 'decoy', r: 50, name: 'decoy' },
};
function load(data) {
  D = data; TR = D.tickrate;
  B = D.background; cell = B.cell || 1;
  [minX, minY, maxX, maxY] = B.bounds;
  for (const R of D.reviews) {
    for (const f of R.frames) f.m = new Map(f.p.map(e => [e[0], e]));
    R.start = R.frames.length ? R.frames[0].t : R.contact_tick;
    R.end = R.frames.length ? R.frames[R.frames.length - 1].t : R.contact_tick;
    for (const e of R.events) {
      e.apos = lastPos(R, e.attacker_id ?? e.planter_id, e.t);
      e.vpos = lastPos(R, e.victim_id, e.t);
    }
    R.utility = R.utility || [];
    // the events list: kills, hits and the plant, plus every grenade that goes off in the clip
    R.feed = R.events.concat(R.utility.filter(u => u.td >= R.start && u.td <= R.end)
      .map(u => ({ t: u.td, type: 'util', u }))).sort((a, b) => a.t - b.t);
  }
  radar = { upper: null, lower: null };
  const img = src => { const i = new Image(); i.onload = draw; i.src = src; return i; };
  if (D.radar) {
    radar.upper = img(D.radar.image);
    if (D.radar.lower) radar.lower = img(D.radar.lower.image);
  }
  level = 'auto'; $('level').hidden = !radar.lower; $('level').textContent = 'Level: auto';
  R = null; filter = null; setPlaying(false);
  $('empty').hidden = true;
  $('mapname').textContent = `${D.map} · ${D.reviews.length} anchor engagements`;
  renderRatings(); renderList(); fitMap();
  if (D.reviews.length) select(D.reviews[0].id);
}
function lastPos(R, pid, t) {
  if (pid == null) return null;
  for (let i = R.frames.length - 1; i >= 0; i--) {
    const f = R.frames[i];
    if (f.t > t) continue;
    const e = f.m.get(pid);
    if (e) return [e[1], e[2]];
  }
  return null;
}

// ---------- state
let R = null, cur = 0, playing = false, speed = 1, filter = null;
const view = { x: 0, y: 0, s: 1 };
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;

function resize() {
  const r = $('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
const sx = x => W / 2 + (x - view.x) * view.s;
const sy = y => H / 2 - (y - view.y) * view.s;

function fitBox(x0, y0, x1, y1) {
  view.x = (x0 + x1) / 2; view.y = (y0 + y1) / 2;
  view.s = Math.min(W / (x1 - x0), H / (y1 - y0)) * 0.92;
  draw();
}
const fitMap = () => fitBox(minX, minY, maxX, maxY);
function focusFight() {
  if (!R) return fitMap();
  const pts = [R.spot];
  for (const f of R.frames) {
    if (Math.abs(f.t - R.contact_tick) > 6 * TR) continue;
    for (const e of f.p) if (R.players[e[0]].local || e[0] === R.anchor_id) pts.push([e[1], e[2]]);
  }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const pad = 700, minSpan = 2600;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const hw = Math.max((x1 - x0) / 2 + pad, minSpan / 2), hh = Math.max((y1 - y0) / 2 + pad, minSpan / 2);
  fitBox(cx - hw, cy - hh, cx + hw, cy + hh);
}

// ---------- interpolation
function frameAt(t) {
  const f = R.frames, n = f.length;
  if (!n) return null;
  if (t <= f[0].t) return [0, 0, 0];
  if (t >= f[n - 1].t) return [n - 1, n - 1, 0];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (f[m].t <= t) lo = m; else hi = m; }
  return [lo, hi, (t - f[lo].t) / (f[hi].t - f[lo].t)];
}
function lerpAngle(a, b, k) { let d = ((b - a + 540) % 360) - 180; return a + d * k; }
function positions(t) {
  const out = new Map(), fa = frameAt(t);
  if (!fa) return out;
  const [a, b, k] = fa, A = R.frames[a].m, Bm = R.frames[b].m;
  for (const [pid, e] of A) {
    const n = Bm.get(pid);
    if (n) out.set(pid, { x: e[1] + (n[1] - e[1]) * k, y: e[2] + (n[2] - e[2]) * k, yaw: lerpAngle(e[3], n[3], k), hp: n[4], z: n[5] });
    else if (a === b || k < 0.5) out.set(pid, { x: e[1], y: e[2], yaw: e[3], hp: e[4], z: e[5] });
  }
  return out;
}

// ---------- drawing
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (!D) return;
  const pos = R ? positions(cur) : new Map();
  const anchor = R ? pos.get(R.anchor_id) : null;
  // two-level maps: follow the anchor unless a level was picked
  const below = D.radar && D.radar.lower ? D.radar.lower.below : null;
  const shown = below == null ? 'upper'
    : level !== 'auto' ? level : anchor && anchor.z != null && anchor.z < below ? 'lower' : 'upper';
  const onShown = p => below == null || p.z == null || (p.z < below) === (shown === 'lower');

  const img = radar[shown];
  if (img && img.complete && img.naturalWidth) {
    // radar overview: pos_x/pos_y is the image's top-left corner in world units, scale = units per pixel
    const s = D.radar.scale * view.s;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, sx(D.radar.pos_x), sy(D.radar.pos_y), img.naturalWidth * s, img.naturalHeight * s);
  } else if (B.cells) {
    // no radar for this map: outline it from where players stood
    ctx.fillStyle = C.map;
    const cs = cell * view.s + 0.6;
    for (const [x, y] of B.cells) ctx.fillRect(sx(x * cell), sy((y + 1) * cell), cs, cs);
  }
  // place labels (radars have no callouts)
  ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.fillStyle = img ? C.text : C['map-label'];
  ctx.globalAlpha = img ? 0.6 : 1;
  for (const l of B.labels) { ctx.strokeText(l.name, sx(l.x), sy(l.y)); ctx.fillText(l.name, sx(l.x), sy(l.y)); }
  ctx.globalAlpha = 1;
  if (!R) return;

  // local-area ring
  const ringAt = anchor || { x: R.spot[0], y: R.spot[1] };
  ctx.save();
  ctx.setLineDash([6, 6]); ctx.strokeStyle = cur >= R.contact_tick ? C.contact : C.muted; ctx.globalAlpha = .55; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx(ringAt.x), sy(ringAt.y), D.local_radius * view.s, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  if (showUtil) drawUtility();

  // events: death markers, shot lines, bomb
  for (const e of R.events) {
    if (e.t > cur) continue;
    const age = (cur - e.t) / TR;
    if (e.type === 'kill' && e.vpos) {
      const victim = R.players[e.victim_id];
      drawX(e.vpos[0], e.vpos[1], victim ? (victim.team === 'CT' ? C.ct : C.t) : C.muted, e.anchor_died);
      if (age < 1.5 && e.apos) line(e.apos, e.vpos, e.by_anchor ? C.good : C.bad, 2.5, 1 - age / 1.5);
    } else if (e.type === 'hurt' && age < 0.6 && e.apos && e.vpos) {
      line(e.apos, e.vpos, e.by_anchor ? C.good : C.bad, 1.2, 0.8 * (1 - age / 0.6));
    } else if (e.type === 'plant' && e.apos) {
      const x = sx(e.apos[0]), y = sy(e.apos[1]);
      ctx.fillStyle = C.bad; ctx.fillRect(x - 6, y - 6, 12, 12);
      ctx.fillStyle = C.bg; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('C4', x, y + 3.5);
    }
  }

  // players
  for (const [pid, p] of pos) {
    const pl = R.players[pid], isA = pid === R.anchor_id;
    const col = pl.team === 'CT' ? C.ct : C.t;
    const x = sx(p.x), y = sy(p.y), r = isA ? 8 : 6;
    const a = p.yaw * Math.PI / 180;
    ctx.globalAlpha = (pl.local || isA ? 1 : 0.45) * (onShown(p) ? 1 : 0.35);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * (r + 12), y - Math.sin(a) * (r + 12)); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if (isA) { ctx.strokeStyle = C.anchor; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.stroke(); }
    // health bar
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 10, y + r + 4, 20, 3);
    ctx.fillStyle = p.hp > 50 ? C.good : p.hp > 20 ? C.contact : C.bad; ctx.fillRect(x - 10, y + r + 4, 20 * Math.max(0, p.hp) / 100, 3);
    // name
    ctx.fillStyle = isA ? C.anchor : C.text; ctx.font = (isA ? '700 ' : '500 ') + '11px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(shortName(pl.name), x + r + 5, y - r);
    ctx.globalAlpha = 1;
  }
}
const shortName = n => n.includes('|') ? n.split('|').pop().trim() : n;

// grenades: a trail while in the air, then the effect where it landed
function drawUtility() {
  for (const u of R.utility) {
    const look = UTIL[u.kind];
    if (!look || cur < u.t0 || cur > u.te + (look.burst || 0) * TR) continue;
    const col = C[look.col];
    if (cur < u.td) {
      // in flight: path so far, in the thrower's team colour, and the grenade itself
      const pts = u.path.filter(p => p[0] <= cur);
      const nx = u.path.find(p => p[0] > cur);
      let head = pts[pts.length - 1];
      if (head && nx) { const k = (cur - head[0]) / (nx[0] - head[0]); head = [cur, head[1] + (nx[1] - head[1]) * k, head[2] + (nx[2] - head[2]) * k]; }
      if (!head) continue;
      ctx.globalAlpha = .7; ctx.strokeStyle = u.team === 'CT' ? C.ct : C.t; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sx(pts[0][1]), sy(pts[0][2]));
      for (const p of pts.slice(1)) ctx.lineTo(sx(p[1]), sy(p[2]));
      ctx.lineTo(sx(head[1]), sy(head[2])); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.strokeStyle = C.bg; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sx(head[1]), sy(head[2]), 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      continue;
    }
    const x = sx(u.x), y = sy(u.y), r = look.r * view.s, age = (cur - u.td) / TR;
    if (look.burst) {
      // flash / HE: a quick expanding burst
      const k = Math.min(1, age / look.burst);
      ctx.globalAlpha = (1 - k) * .8;
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, Math.max(4, r * (0.3 + 0.7 * k)), 0, Math.PI * 2); ctx.stroke();
      if (u.kind === 'flash') { ctx.fillStyle = col; ctx.globalAlpha = (1 - k) * .35; ctx.fill(); }
    } else {
      // smoke / fire / decoy: an area that fades in and out
      const left = (u.te - cur) / TR;
      ctx.globalAlpha = Math.max(0, Math.min(1, age / 0.5, left / 1)) * (u.kind === 'smoke' ? .6 : .45);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y, Math.max(3, r), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha *= 1.4; ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}
function drawX(wx, wy, col, big) {
  const x = sx(wx), y = sy(wy), s = big ? 7 : 5;
  ctx.strokeStyle = col; ctx.lineWidth = big ? 3 : 2; ctx.globalAlpha = .85;
  ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
  ctx.globalAlpha = 1;
}
function line(a, b, col, w, alpha) {
  ctx.globalAlpha = Math.max(0, alpha); ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(sx(a[0]), sy(a[1])); ctx.lineTo(sx(b[0]), sy(b[1])); ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---------- UI: sidebar
function renderRatings() {
  const rows = D.ratings.map(r => `<tr class="row ${filter === r.player ? 'sel' : ''}" data-p="${esc(r.player)}">
      <td>${esc(shortName(r.player))}</td><td>${r.engagements}</td><td>${r.kills}/${r.exp_kills.toFixed(1)}</td>
      <td class="${cls(r.anchor_rating - 1)}"><b>${r.anchor_rating.toFixed(2)}</b></td></tr>`).join('');
  $('ratings').innerHTML = `<tr><th>Player</th><th>Fights</th><th>K/exp</th><th>Rating</th></tr>${rows}`;
  $('ratings').querySelectorAll('tr.row').forEach(tr => tr.onclick = () => {
    filter = filter === tr.dataset.p ? null : tr.dataset.p; renderRatings(); renderList();
  });
}
function visible() { return D.reviews.filter(r => !filter || r.player === filter); }
function renderList() {
  $('list').innerHTML = visible().map(r => `<li data-id="${r.id}" class="${R && R.id === r.id ? 'on' : ''}">
      <span class="r">R${r.round}</span><span class="who">${esc(shortName(r.player))}</span>
      <span class="sc ${cls(r.score)}">${fmt(r.score)}</span>
      <span class="meta">${r.site} · ${r.situation} · ${r.kills}K${r.contact === 'no contact' ? ' · no contact' : ''}</span></li>`).join('');
  $('list').querySelectorAll('li').forEach(li => li.onclick = () => select(+li.dataset.id));
}

// ---------- UI: notes
function rel(t) { const s = (t - R.contact_tick) / TR; return (s >= 0 ? '+' : '') + s.toFixed(1) + 's'; }
function eventText(e) {
  if (e.type === 'contact') return '<b>First contact</b>';
  if (e.type === 'plant') return `${esc(shortName(e.planter))} planted the bomb`;
  if (e.type === 'hurt') return `${esc(shortName(e.attacker))} hit ${esc(shortName(e.victim))} for ${e.dmg}`;
  if (e.type === 'util') {
    const u = e.u, who = `<span class="dot" style="background:var(--${UTIL[u.kind].col})"></span>${esc(shortName(u.by))}'s ${UTIL[u.kind].name}`;
    if (u.kind !== 'flash') return `<span style="color:var(--muted)">${who}${u.kind === 'smoke' ? ' popped' : ' landed'}</span>`;
    if (!u.blinded.length) return `<span style="color:var(--muted)">${who} blinded nobody</span>`;
    const hitAnchor = u.blinded.some(b => b[0] === R.player);
    return `<span class="${hitAnchor ? 'neg' : ''}">${who} blinded ${u.blinded.map(b => `${esc(shortName(b[0]))} ${b[1]}s`).join(', ')}</span>`;
  }
  const w = e.weapon ? ` <span style="color:var(--muted)">(${esc(e.weapon)}${e.hs ? ', HS' : ''})</span>` : '';
  const c = e.by_anchor ? 'pos' : e.anchor_died ? 'neg' : '';
  return `<span class="${c}">${esc(shortName(e.attacker))} killed ${esc(shortName(e.victim))}</span>${w}`;
}
function renderNotes() {
  const total = R.breakdown.reduce((s, b) => s + b.value, 0);
  $('notes').innerHTML = `
    <div class="head">
      <div><div class="title">${esc(R.player)}</div>
        <div class="badges"><span class="badge">Round ${R.round}</span><span class="badge">Site ${R.site}</span>
          <span class="badge">${R.situation}</span><span class="badge">${R.round_won ? 'CT win' : 'T win'}</span></div></div>
      <div class="big ${cls(R.score)}">${fmt(R.score)}<small>vs average anchor</small></div>
    </div>
    <h2>Why this score</h2>
    <ul class="why">${R.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    <h2>Score breakdown</h2>
    <table class="bd">${R.breakdown.map(b => `<tr><td>${esc(b.label)}<div class="d">${esc(b.detail)}</div></td>
        <td class="${cls(b.value)}">${fmt(b.value)}</td></tr>`).join('')}
      <tr class="total"><td>Fight score</td><td class="${cls(total)}">${fmt(total)}</td></tr></table>
    <h2>Events</h2>
    <ul class="feed" id="feed">${R.feed.map((e, i) => `<li data-i="${i}" class="${e.type === 'util' ? 'util' : ''}"><span class="tm">${rel(e.t)}</span><span>${eventText(e)}</span></li>`).join('')}</ul>
    <p class="hint" style="margin-top:16px">HLTV 3.0-style: six sub-ratings (1.00 = average anchor fight) weighted into the fight score. Rating = 1.00 + average fight score.</p>`;
  $('feed').querySelectorAll('li').forEach(li => li.onclick = () => { seek(R.feed[+li.dataset.i].t - 2 * TR); });
  updateFeed();
}
function updateFeed() {
  const f = $('feed'); if (!f) return;
  f.classList.toggle('no-util', !showUtil);
  f.querySelectorAll('li').forEach(li => li.classList.toggle('past', R.feed[+li.dataset.i].t <= cur));
}

// ---------- timeline
function renderMarks() {
  const span = Math.max(1, R.end - R.start);
  $('marks').innerHTML = R.events.filter(e => e.type !== 'hurt').map(e => {
    const col = e.type === 'contact' ? 'var(--contact)' : e.type === 'plant' ? 'var(--bad)'
      : e.by_anchor ? 'var(--good)' : e.anchor_died ? 'var(--bad)' : 'var(--muted)';
    return `<span class="mark" title="${e.type}" style="left:${(e.t - R.start) / span * 100}%;background:${col}"></span>`;
  }).join('');
}
function seek(t) {
  cur = Math.max(R.start, Math.min(R.end, t));
  $('scrub').value = cur;
  $('clock').textContent = `Round ${R.round} · contact ${rel(cur)}`;
  updateFeed(); draw();
}
function select(id) {
  R = D.reviews.find(r => r.id === id);
  $('scrub').min = R.start; $('scrub').max = R.end;
  renderList(); renderNotes(); renderMarks();
  focusFight();
  seek(R.start);
  setPlaying(true);
}
function step(dir) {
  if (!R) return;
  const v = visible(), i = v.findIndex(r => r.id === R.id);
  const n = v[(i + dir + v.length) % v.length];
  if (n) select(n.id);
}

// ---------- playback
function setPlaying(p) { playing = p; $('play').textContent = p ? 'Pause' : 'Play'; }
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && R) {
    if (cur >= R.end) setPlaying(false);
    else seek(cur + dt * TR * speed);
  }
  requestAnimationFrame(tick);
}

$('play').onclick = () => { if (R && cur >= R.end) seek(R.start); setPlaying(!playing); };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('tocontact').onclick = () => R && seek(R.contact_tick);
$('speed').onchange = e => speed = +e.target.value;
$('fit').onclick = fitMap;
$('focus').onclick = focusFight;
$('util').onclick = () => {
  showUtil = !showUtil;
  $('util').textContent = 'Utility: ' + (showUtil ? 'on' : 'off');
  document.body.classList.toggle('no-util', !showUtil);
  if (R) updateFeed();
  draw();
};
$('level').onclick = () => {
  level = { auto: 'upper', upper: 'lower', lower: 'auto' }[level];
  $('level').textContent = 'Level: ' + level; draw();
};
$('scrub').oninput = e => { setPlaying(false); seek(+e.target.value); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || !R) return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.key === 'ArrowRight') seek(cur + TR);
  else if (e.key === 'ArrowLeft') seek(cur - TR);
  else if (e.key === ']') step(1);
  else if (e.key === '[') step(-1);
  else if (e.key === 'u' || e.key === 'U') $('util').click();
});

// zoom + pan
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = view.x + (mx - W / 2) / view.s, wy = view.y - (my - H / 2) / view.s;
  view.s *= Math.exp(-e.deltaY * 0.0015);
  view.x = wx - (mx - W / 2) / view.s; view.y = wy + (my - H / 2) / view.s;
  draw();
}, { passive: false });
let dragFrom = null;
cv.addEventListener('pointerdown', e => { dragFrom = [e.clientX, e.clientY, view.x, view.y]; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!dragFrom) return;
  view.x = dragFrom[2] - (e.clientX - dragFrom[0]) / view.s;
  view.y = dragFrom[3] + (e.clientY - dragFrom[1]) / view.s;
  draw();
});
cv.addEventListener('pointerup', () => { dragFrom = null; cv.classList.remove('drag'); });

// ---------- app mode: demo library, uploads and parse jobs
const uploads = new Map();    // local id -> { name, pct }
const notices = [];           // client-side errors, e.g. a rejected upload
const dismissed = new Set();  // server job ids whose error was closed
const opened = new Set();     // finished job ids already acted on
let jobs = [], wanted = new Set(), demos = [], uploadSeq = 0, offline = false;
const OFFLINE = "Can't reach Anchor Review. Start run.bat again (keep its window open), then upload again.";

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function refreshDemos(open) {
  demos = await getJSON('/api/demos');
  $('demoPick').innerHTML = demos.length
    ? demos.map(d => `<option value="${esc(d.name)}">${esc(d.name)} · ${esc(d.map)} · ${d.engagements} fights</option>`).join('')
    : '<option value="">No demos yet</option>';
  if (open) await openDemo(open);
  else if (!D && demos.length) await openDemo(demos[0].name);
  else if (D) $('demoPick').value = D.name || '';
  if (!demos.length && !D) $('empty').hidden = false;
}
async function openDemo(name) {
  try {
    const data = await getJSON('/api/demos/' + encodeURIComponent(name));
    data.name = name;
    load(data);
    $('demoPick').value = name;
    $('exportBtn').href = `/api/demos/${encodeURIComponent(name)}/export`;
    $('exportBtn').hidden = false;
  } catch (e) { notices.push(`Couldn't open ${name}: ${e.message}`); renderJobs(); }
}

function renderJobs() {
  const items = [];
  if (offline) items.push(`<li class="err"><div class="st"><span>${OFFLINE}</span></div></li>`);
  $('uploadBtn').disabled = offline;
  for (const u of uploads.values())
    items.push(`<li><div class="nm">${esc(u.name)}</div><div class="st"><span>Uploading</span><span>${u.pct}%</span></div>
      <div class="prog"><i style="width:${u.pct}%"></i></div></li>`);
  for (const j of jobs) {
    if (j.status === 'queued' || j.status === 'parsing')
      items.push(`<li><div class="nm">${esc(j.name)}</div><div class="st"><span>${j.status === 'queued' ? 'Waiting for the parser' : 'Parsing demo…'}</span></div>
        <div class="prog busy"><i></i></div></li>`);
    else if (j.status === 'error' && !dismissed.has(j.id))
      items.push(`<li class="err"><div class="nm">${esc(j.name)}</div><div class="st"><span>${esc(j.message)}</span>
        <button class="x" data-job="${esc(j.id)}" title="Dismiss">&times;</button></div></li>`);
  }
  notices.forEach((n, i) => items.push(`<li class="err"><div class="st"><span>${esc(n)}</span>
      <button class="x" data-note="${i}" title="Dismiss">&times;</button></div></li>`));
  $('jobs').innerHTML = items.join('');
  $('jobs').querySelectorAll('[data-job]').forEach(b => b.onclick = () => { dismissed.add(b.dataset.job); renderJobs(); });
  $('jobs').querySelectorAll('[data-note]').forEach(b => b.onclick = () => { notices.splice(+b.dataset.note, 1); renderJobs(); });
}

async function pollJobs() {
  try {
    jobs = await getJSON('/api/jobs');
    const finished = jobs.filter(j => j.status === 'done' && !opened.has(j.id));
    finished.forEach(j => opened.add(j.id));
    const mine = finished.filter(j => wanted.has(j.id)).pop();
    if (finished.length || offline) await refreshDemos(mine ? mine.demo : null);
    offline = false;
    renderJobs();
  } catch (e) {  // the app was closed or restarted; keep checking so the page recovers when it's back
    if (!offline) { offline = true; renderJobs(); }
  }
  setTimeout(pollJobs, 1500);
}

function upload(file) {
  if (!/\.dem$/i.test(file.name)) { notices.push(`${file.name} isn't a .dem file.`); renderJobs(); return; }
  const id = ++uploadSeq;
  uploads.set(id, { name: file.name, pct: 0 });
  renderJobs();
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) { uploads.get(id).pct = Math.round(e.loaded / e.total * 100); renderJobs(); }
  };
  xhr.onloadend = () => {
    uploads.delete(id);
    let res = {};
    try { res = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200) { wanted.add(res.id); jobs.push(res); }
    else if (xhr.status === 0) { offline = true; notices.push(`Uploading ${file.name} failed: the app isn't running.`); }
    else notices.push(res.error || `Uploading ${file.name} failed (error ${xhr.status}).`);
    renderJobs();
  };
  xhr.send(file);
}

function startApp() {
  $('lib').hidden = false;
  const pick = () => $('file').click();
  $('uploadBtn').onclick = pick;
  $('emptyUpload').onclick = pick;
  $('file').onchange = e => { [...e.target.files].forEach(upload); e.target.value = ''; };
  $('demoPick').onchange = e => e.target.value && openDemo(e.target.value);
  let depth = 0;  // dragenter/leave fire for every child element
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  window.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; document.body.classList.add('dropping'); } });
  window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dropping'); } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; document.body.classList.remove('dropping');
    [...e.dataTransfer.files].forEach(upload);
  });
  refreshDemos().catch(e => { notices.push(e.message); renderJobs(); });
  pollJobs();
}

window.addEventListener('resize', resize);
resize();
if (EMBEDDED) load(EMBEDDED);
else if (location.protocol === 'file:') {
  // opened from disk instead of through the app, so there's nothing to upload to
  $('empty').hidden = false;
  $('empty').innerHTML = `<div><b>Start the app to upload demos</b>
    <p class="hint">Double-click <code>run.bat</code> (or run <code>./run.sh</code>) in the anchor-stats folder.<br>
    Anchor Review opens in your browser with the Upload button, and parses demos as you add them.</p></div>`;
} else startApp();
requestAnimationFrame(tick);
</script>
</body>
</html>
